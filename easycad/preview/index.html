    async function resolveInitialPart() {
      const [catalog, latestRes] = await Promise.all([
        fetchCatalog(),
        fetch(base + '/latest', { cache: 'no-store' }),
      ])
      partsCatalog = normalizeCatalog(catalog).parts
      const names = normalizeCatalog(catalog).names
      const latest = latestRes.ok ? await latestRes.json() : {}
      const urlName = query.get('name') || ''
      if (urlName && names.includes(urlName)) {
        return { name: urlName, stamp: Number(latest.updatedAt) || 0 }
      }
      if (latest.name && names.includes(latest.name)) {
        return { name: latest.name, stamp: Number(latest.updatedAt) || 0 }
      }
      for (let i = names.length - 1; i >= 0; i -= 1) {
        const row = partsCatalog.find((item) => item.name === names[i])
        if (row && (row.hasGlb || row.hasScript || row.hasStep)) {
          return { name: names[i], stamp: 0 }
        }
      }
      return { name: urlName || names[0] || 'loop_demo', stamp: 0 }
    }

    function modelUrl(relPath) {
      return base + '/models/' + String(relPath || '').split('/').map(encodeURIComponent).join('/')
    }

    async function ensureGlb() {
      const row = partsCatalog.find((item) => item.name === name)
      const glbPath = row?.glbPath || `${name}.glb`
      const probe = await fetch(modelUrl(glbPath), { cache: 'no-store' })
      // A viewable GLB is a few KB; a tiny file is a broken export. Only trust
      // it when it is large enough to hold a real mesh.
      if (probe.ok && Number(probe.headers.get('content-length') || 0) >= 1024) return glbPath
      if (!row || (!row.hasScript && !row.hasStep)) return null
      setLoading(t('ensuringGlb'))
      const res = await fetch(base + '/ensure-glb?name=' + encodeURIComponent(name), { cache: 'no-store' })
      const data = res.ok ? await res.json() : {}
      if (data.ok !== false && data.artifacts && data.artifacts.glb) {
        return data.artifacts.glb.replace(/^models\//, '')
      }
      if (probe.ok) return glbPath
      return null
    }

    function computeEnvelope() {
      const L = allParams.length || baseline.length
      const W = allParams.width || baseline.width
      const H = allParams.height || baseline.height
      const c = partCenter.clone()
      return {
        min: new THREE.Vector3(c.x - L / 2, c.y - W / 2, c.z - H / 2),
        max: new THREE.Vector3(c.x + L / 2, c.y + W / 2, c.z + H / 2),
        half: new THREE.Vector3(L / 2, W / 2, H / 2),
      }
    }

    function triangleArea(a, b, c) {
      const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z
      const acx = c.x - a.x, acy = c.y - a.y, acz = c.z - a.z
      const cx = aby * acz - abz * acy
      const cy = abz * acx - abx * acz
      const cz = abx * acy - aby * acx
      return 0.5 * Math.hypot(cx, cy, cz)
    }

    function faceKeyFromTriangle(n, mid, scale) {
      const nx = Math.round(n.x * 50) / 50
      const ny = Math.round(n.y * 50) / 50
      const nz = Math.round(n.z * 50) / 50
      const d = -(n.x * mid.x + n.y * mid.y + n.z * mid.z) / Math.max(1e-6, scale)
      const dd = Math.round(d * 200) / 200
      return nx + ',' + ny + ',' + nz + '|' + dd
    }

    function rebuildFaceClusters() {
      faceClusters = []
      triToFace = null
      meshTriangleOffset = null
      if (!modelRoot || !scene) return
      scene.updateMatrixWorld(true)
      envelope = computeEnvelope()
      const va = new THREE.Vector3(), vb = new THREE.Vector3(), vc = new THREE.Vector3()
      const n = new THREE.Vector3(), ab = new THREE.Vector3(), ac = new THREE.Vector3()
      const mid = new THREE.Vector3()
      const ranges = (faceTopology && Array.isArray(faceTopology.ranges) && faceTopology.ranges.length)
        ? faceTopology.ranges : null
      const meshes = []
      modelRoot.traverse((obj) => { if (obj.isMesh) meshes.push(obj) })
      const offsets = new Map()
      const triFaceArr = []
      const recs = []
      let triOffset = 0
      // Authoritative triangle->face map from the topology sidecar (cad-viewer style):
      // each triangle in the GLB belongs to the face whose [start,start+count) covers
      // it. This is correct regardless of how GLTFLoader groups the meshes. If no
      // sidecar, fall back to one face per mesh.
      const faceCount = ranges ? ranges.length : meshes.length
      for (let i = 0; i < faceCount; i += 1) recs.push({ id: i, normal: new THREE.Vector3(), area: 0, centroid: new THREE.Vector3(), count: 0, positions: [] })
      let rangeCursor = 0
      meshes.forEach((obj) => {
        const geom = obj.geometry
        const pos = geom.attributes.position
        if (!pos) return
        const index = geom.index
        const triCount = Math.floor((index ? index.count : pos.count) / 3)
        offsets.set(obj.uuid, triOffset)
        for (let t = 0; t < triCount; t += 1) {
          const g = triOffset + t
          let fid
          if (ranges) {
            while (rangeCursor < ranges.length && g >= ranges[rangeCursor].start + ranges[rangeCursor].count) rangeCursor += 1
            fid = rangeCursor < ranges.length ? ranges[rangeCursor].id : 0
          } else {
            fid = meshes.indexOf(obj)
          }
          const i = t * 3
          const ia = index ? index.getX(i) : i
          const ib = index ? index.getX(i + 1) : i + 1
          const ic = index ? index.getX(i + 2) : i + 2
          va.fromBufferAttribute(pos, ia).applyMatrix4(obj.matrixWorld)
          vb.fromBufferAttribute(pos, ib).applyMatrix4(obj.matrixWorld)
          vc.fromBufferAttribute(pos, ic).applyMatrix4(obj.matrixWorld)
          ab.subVectors(vb, va)
          ac.subVectors(vc, va)
          n.crossVectors(ab, ac).normalize()
          mid.addVectors(va, vb).add(vc).multiplyScalar(1 / 3)
          const rec = recs[fid] || recs[0]
          rec.area += triangleArea(va, vb, vc)
          rec.centroid.add(mid)
          rec.normal.add(n)
          rec.count += 1
          rec.positions.push(va.x, va.y, va.z, vb.x, vb.y, vb.z, vc.x, vc.y, vc.z)
          triFaceArr[g] = fid
        }
        triOffset += triCount
      })
      meshTriangleOffset = offsets
      triToFace = Int32Array.from(triFaceArr)
      recs.forEach((rec) => {
        rec.normal = rec.normal.lengthSq() ? rec.normal.clone().normalize() : new THREE.Vector3(0, 0, 1)
        rec.centroid = rec.centroid.clone().divideScalar(Math.max(1, rec.count))
      })
      faceClusters = recs
      for (const rec of faceClusters) rec.geometry = faceGeometry(rec.id)
      rebuildFacePickGroup()
      applyDisplayState()
    }

    function removeMesh(meshRef) {
      if (meshRef) scene.remove(meshRef)
    }

    // cad-viewer-style dedicated face-pick surface: one invisible mesh per B-rep
    // face (opacity 0), each carrying userData.faceId. Picking raycasts THIS group
    // so it never depends on how GLTFLoader grouped the model's meshes.
    function rebuildFacePickGroup() {
      if (!scene) return
      if (facePickGroup) {
        scene.remove(facePickGroup)
        for (const c of facePickGroup.children) c.geometry && c.geometry.dispose && c.geometry.dispose()
      }
      facePickGroup = new THREE.Group()
      const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide })
      for (const rec of faceClusters) {
        const geom = new THREE.BufferGeometry()
        geom.setAttribute('position', new THREE.Float32BufferAttribute(rec.positions, 3))
        const m = new THREE.Mesh(geom, mat)
        m.userData.faceId = rec.id
        m.frustumCulled = false
        facePickGroup.add(m)
      }
      scene.add(facePickGroup)
    }

    function faceGeometry(faceId) {
      const rec = faceClusters[faceId]
      if (!rec) return null
      // Prefer the geometry cached in rebuildFaceClusters; fall back to building it.
      if (rec.geometry) return rec.geometry
      if (!rec.positions.length) return null
      const geom = new THREE.BufferGeometry()
      geom.setAttribute('position', new THREE.Float32BufferAttribute(rec.positions.slice(), 3))
      geom.computeVertexNormals()
      rec.geometry = geom
      return geom
    }

    function showFace(meshRef, faceId, color, opacity) {
      if (meshRef) scene.remove(meshRef)
      if (faceId === null || faceId === undefined) return null
      const geom = faceGeometry(faceId)
      if (!geom) return null
      const mesh = new THREE.Mesh(
        geom,
        new THREE.MeshBasicMaterial({
          color, transparent: true, opacity, depthTest: true, side: THREE.DoubleSide,
          polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1,
        }),
      )
      mesh.raycast = () => {}
      scene.add(mesh)
      return mesh
    }

    function faceInfo(faceId) {
      const rec = faceClusters[faceId]
      if (!rec) return null
      const nrm = rec.normal
      const ax = Math.abs(nrm.x), ay = Math.abs(nrm.y), az = Math.abs(nrm.z)
      let axis = t('axisOblique')
      if (ax >= ay && ax >= az) axis = (nrm.x >= 0 ? '+X' : '-X')
      else if (ay >= ax && ay >= az) axis = (nrm.y >= 0 ? '+Y' : '-Y')
      else if (az >= ax && az >= ay) axis = (nrm.z >= 0 ? '+Z' : '-Z')
      return {
        id: faceId,
        area: rec.area,
        centroid: [rec.centroid.x, rec.centroid.y, rec.centroid.z],
        normal: [rec.normal.x, rec.normal.y, rec.normal.z],
        axis,
        count: rec.count,
      }
    }

    function renderFaceInfo() {
      const html = (() => {
        if (selected === null || !faceClusters[selected]) {
          return '<div class="info-empty">' + t('faceEmpty') + '</div>'
        }
        const info = faceInfo(selected)
        const f = (v) => Number(v).toFixed(2)
        const topo = (faceTopology && faceTopology.faces && faceTopology.faces[selected]) ? faceTopology.faces[selected] : null
        const typeRow = topo
          ? '<div class="info-row"><span>' + t('faceType') + '</span><span class="info-val">' + esc(topo.type) + '</span></div>'
          : ''
        return '<div class="info-row"><span>' + t('faceId', { id: info.id }) + '</span><span class="info-val">' + info.axis + '</span></div>'
          + typeRow
          + '<div class="info-row"><span>' + t('faceArea') + '</span><span class="info-val">' + f(info.area) + ' mm²</span></div>'
          + '<div class="info-row"><span>' + t('faceNormal') + '</span><span class="info-val">(' + info.normal.map(f).join(', ') + ')</span></div>'
          + '<div class="info-row"><span>' + t('faceCentroid') + '</span><span class="info-val">(' + info.centroid.map(f).join(', ') + ')</span></div>'
          + '<div class="info-row"><span>' + t('faceTris') + '</span><span class="info-val">' + info.count + '</span></div>'
      })()
      const partBox = document.getElementById('face-info')
      const runnerBox = document.getElementById('runner-face')
      if (partBox) partBox.innerHTML = html
      if (runnerBox) runnerBox.innerHTML = html
    }

    function selectFace(faceId) {
      if (faceId === null || faceId === undefined || !faceClusters[faceId]) {
        clearSelect()
        return
      }
      if (workMode === 'runner') {
        if (runnerPick && runnerPick !== 'inspect' && runnerView === 'part') {
          toggleRunnerFace(faceId)
        }
        selected = faceId
        highlight = showFace(highlight, faceId, 0x2563eb, 0.18)
        renderFaceInfo()
        renderTree()
        setStatus(t('selectedFace', { id: faceId }), 'ok')
        return
      }
      selected = faceId
      highlight = showFace(highlight, faceId, 0x2563eb, 0.32)
      renderFaceInfo()
      renderTree()
      selectFaceFeatureLink(faceId)
      setStatus(t('selectedFace', { id: faceId }), 'ok')
    }

    // Field factory: one number input per editable param, so a single Edit card
    // exposes every adjustable dimension (length/width/height/hole_d) at once.
    // `featureSel` uses the FEATURES key ('length'/'width'/'height'/'hole') so it
    // stays consistent with renderParamList; here we convert each PARAM_ORDER key
    // to that same key for highlighting.
    function featureKey(key) {
      return key === 'hole_d' ? 'hole' : key
    }

    function renderBatchFields(focus) {
      const rows = []
      for (const key of PARAM_ORDER) {
        const spec = FEATURES[featureKey(key)]
        if (!spec || allParams[spec.id] == null) continue
        const active = featureSel === featureKey(key) ? ' data-active="true"' : ''
        const shown = Number(allParams[spec.id]).toFixed(key === 'hole_d' ? 1 : 2)
        rows.push(`<div class="batch-row"${active} data-param="${featureKey(key)}">`
          + `<label>${PARAM_LABELS[key] || spec.title}</label>`
          + `<input type="number" min="0.1" step="0.1" value="${shown}" data-param="${featureKey(key)}" />`
          + `<span class="unit">mm</span>`
          + `<span class="batch-hint">${spec.hint}</span>`
          + `</div>`)
      }
      batchFieldsEl.innerHTML = rows.join('')
      if (focus) {
        const el = batchFieldsEl.querySelector(`input[data-param="${focus}"]`)
        if (el) { el.focus(); el.select() }
      }
    }

    function selectParam(feature) {
      featureSel = feature
      renderParamList()
      const spec = FEATURES[feature]
      const anyParam = PARAM_ORDER.some((key) => FEATURES[featureKey(key)] && allParams[FEATURES[featureKey(key)].id] != null)
      if (!anyParam) {
        inspectorEmpty.hidden = false
        inspectorEdit.hidden = true
        inspectorEmpty.textContent = spec
          ? t('paramMissingLinked', { title: spec.title })
          : t('paramMissing')
        return
      }
      document.getElementById('card-title').textContent = spec ? spec.title : t('editDims')
      document.getElementById('card-hint').textContent = spec ? spec.hint : t('editApplyHint')
      inspectorEmpty.hidden = true
      inspectorEdit.hidden = false
      renderBatchFields(spec && allParams[spec.id] != null ? feature : null)
      setStatus(spec ? t('editing', { title: spec.title }) : t('editingParams'), '')
    }

    function clearSelect() {
      selected = null
      featureSel = null
      if (highlight) { scene.remove(highlight); highlight = null }
      if (hoverMesh) { scene.remove(hoverMesh); hoverMesh = null }
      inspectorEmpty.hidden = false
      inspectorEdit.hidden = true
      renderParamList()
      renderFaceInfo()
      setStatus(t('ready'), '')
      renderTree()
    }

    function selectFaceFeatureLink(faceId) {
      const info = faceInfo(faceId)
      if (!info) return
      const map = { '+X': 'length', '-X': 'length', '+Y': 'width', '-Y': 'width', '+Z': 'height', '-Z': 'height' }
      const feature = map[info.axis]
      if (feature && FEATURES[feature]) selectParam(feature)
    }

    function buildEdgeLines() {
      for (const line of edgeLineSegments) { if (line.parent) line.parent.remove(line) }
      edgeLineSegments = []
      if (!modelRoot) return
      // Edges are parented under their source mesh so they inherit the model's
      // transform (scale/rotate) — no need to rebuild them on a param live-preview.
      modelRoot.traverse((obj) => {
        if (!obj.isMesh || !obj.geometry) return
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(obj.geometry, 30),
          new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.7 }),
        )
        edges.visible = showEdges
        edges.raycast = () => {}
        obj.add(edges)
        edgeLineSegments.push(edges)
      })
    }

    function applyDisplayState() {
      for (const line of edgeLineSegments) line.visible = showEdges
      if (gridHelper) gridHelper.visible = showGrid
    }

    function syncDisplayToggles() {
      const edgeBtn = document.getElementById('toggle-edges')
      const gridBtn = document.getElementById('toggle-grid')
      if (edgeBtn) {
        edgeBtn.dataset.active = String(showEdges)
        const val = edgeBtn.querySelector('.param-value')
        if (val) val.textContent = showEdges ? t('on') : t('off')
      }
      if (gridBtn) {
        gridBtn.dataset.active = String(showGrid)
        const val = gridBtn.querySelector('.param-value')
        if (val) val.textContent = showGrid ? t('on') : t('off')
      }
    }

    function toggleEdges() {
      showEdges = !showEdges
      applyDisplayState()
      syncDisplayToggles()
    }

    function toggleGrid() {
      showGrid = !showGrid
      applyDisplayState()
      syncDisplayToggles()
    }

    function updateModelScale() {
      if (!modelRoot) return
      const sx = (allParams.length || baseline.length) / baseline.length
      const sy = (allParams.width || baseline.width) / baseline.width
      const sz = (allParams.height || baseline.height) / baseline.height
      modelRoot.scale.set(sx, sy, sz)
    }

    function applyPreviewScale() {
      updateModelScale()
      rebuildFaceClusters()
    }

    // Fired once per model load: apply the size scale, then rebuild the face
    // clusters and (cheaply) the display state. Nothing else needs a full rebuild.
    function syncModelAndClusters() {
      updateModelScale()
      rebuildFaceClusters()
    }

    function pickAt(clientX, clientY) {
      if (!camera || !facePickGroup || !facePickGroup.children.length) return null
      const rect = renderer.domElement.getBoundingClientRect()
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1
      raycaster.setFromCamera(pointer, camera)
      const hits = raycaster.intersectObjects(facePickGroup.children, false)
      if (!hits.length) return null
      const fid = hits[0].object.userData.faceId
      return Number.isFinite(fid) ? fid : null
    }

    function pick(event) {
      return pickAt(event.clientX, event.clientY)
    }

    function alignGrid(object) {
      const box = new THREE.Box3().setFromObject(object)
      const size = box.getSize(new THREE.Vector3())
      const span = Math.max(size.x, size.y, size.z) * 2.5 || 100
      const center = box.getCenter(new THREE.Vector3())
      if (gridHelper) scene.remove(gridHelper)
      gridHelper = new THREE.GridHelper(span, Math.min(40, Math.max(10, Math.round(span / 10))), 0xc4c9d0, 0xdce0e5)
      gridHelper.position.set(center.x, box.min.y - 0.02, center.z)
      scene.add(gridHelper)
    }

    function fitCamera(object) {
      const box = new THREE.Box3().setFromObject(object)
      const size = box.getSize(new THREE.Vector3()).length()
      partCenter = box.getCenter(new THREE.Vector3())
      viewDistance = size * 1.15
      controls.target.copy(partCenter)
      camera.position.copy(partCenter).add(new THREE.Vector3(viewDistance, viewDistance * 0.75, viewDistance))
      camera.near = Math.max(size / 200, 0.01)
      camera.far = size * 30
      camera.updateProjectionMatrix()
      alignGrid(object)
    }

    function setView(preset) {
      if (!modelRoot || !camera) return
      // trimesh GLB keeps build123d Z-up; three.js camera is Y-up, so these
      // presets are world-axis looks, not CAD "top of the part".
      const offsets = {
        iso: new THREE.Vector3(1, 1, 1),
        front: new THREE.Vector3(0, 0, 1),
        top: new THREE.Vector3(0, 1, 0),
        right: new THREE.Vector3(1, 0, 0),
      }
      const off = offsets[preset] || offsets.iso
      controls.target.copy(partCenter)
      camera.position.copy(partCenter).add(off.clone().normalize().multiplyScalar(viewDistance))
      controls.update()
      document.querySelectorAll('[data-view]').forEach((btn) => {
        btn.dataset.active = btn.dataset.view === preset ? 'true' : 'false'
      })
      const moldBtn = document.getElementById('view-mold')
      if (moldBtn) moldBtn.dataset.active = 'false'
    }

    function moldOrbitTarget(object) {
      const box = new THREE.Box3().setFromObject(object)
      const mid = box.getCenter(new THREE.Vector3())
      // Two plates on XY, open faces toward +Z. Pivot in the gap, on the
      // parting faces — not the steel volume centroid.
      mid.z = box.max.z
      return mid
    }

    function setMoldCamera() {
      if (!modelRoot || !camera) return
      partCenter.copy(moldOrbitTarget(modelRoot))
      const off = new THREE.Vector3(0.22, 0.5, 1).normalize()
      controls.target.copy(partCenter)
      camera.position.copy(partCenter).add(off.multiplyScalar(viewDistance * 0.95))
      controls.update()
      document.querySelectorAll('[data-view]').forEach((btn) => {
        btn.dataset.active = 'false'
      })
      const moldBtn = document.getElementById('view-mold')
      if (moldBtn) moldBtn.dataset.active = 'true'
    }

    function syncMoldButton() {
      const moldBtn = document.getElementById('view-mold')
      if (!moldBtn) return
      moldBtn.hidden = workMode !== 'runner'
      moldBtn.dataset.active = runnerView === 'mold' ? 'true' : 'false'
    }

    function ensureScene() {
      if (scene) return
      scene = new THREE.Scene()
      scene.background = new THREE.Color(0xeceff3)
      camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000)
      renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setClearColor(0xeceff3, 1)
      view.insertBefore(renderer.domElement, status)
      renderer.domElement.style.touchAction = 'none'
      renderer.domElement.style.userSelect = 'none'
      controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      controls.dampingFactor = 0.1
      controls.enableRotate = true
      controls.enablePan = true
      controls.enableZoom = true
      controls.rotateSpeed = 1
      controls.panSpeed = 1.35
      controls.zoomSpeed = 1
      if ('zoomToCursor' in controls) controls.zoomToCursor = true
      controls.minPolarAngle = 0
      controls.maxPolarAngle = Math.PI
      scene.add(new THREE.AmbientLight(0xffffff, 0.82))
      const key = new THREE.DirectionalLight(0xffffff, 0.78)
      key.position.set(3, 4, 5)
      scene.add(key)
      const fill = new THREE.DirectionalLight(0xffffff, 0.34)
      fill.position.set(-2, -1, 3)
      scene.add(fill)
      function resize() {
        const w = view.clientWidth, h = view.clientHeight
        camera.aspect = w / Math.max(h, 1)
        camera.updateProjectionMatrix()
        renderer.setSize(w, h, false)
      }
      resize()
      new ResizeObserver(resize).observe(view)
      renderer.domElement.addEventListener('pointerdown', (event) => {
        down.x = event.clientX
        down.y = event.clientY
        down.at = Date.now()
      })
      let hoverRaf = 0
      let lastHoverX = 0
      let lastHoverY = 0
      renderer.domElement.addEventListener('pointermove', (event) => {
        lastHoverX = event.clientX
        lastHoverY = event.clientY
        if (hoverRaf) return
        hoverRaf = requestAnimationFrame(() => {
          hoverRaf = 0
          const fid = pickAt(lastHoverX, lastHoverY)
          hoverMesh = showFace(hoverMesh, fid !== null && fid !== selected ? fid : null, 0x60a5fa, 0.16)
          renderer.domElement.style.cursor = (fid !== null) ? 'pointer' : ''
        })
      })
      renderer.domElement.addEventListener('pointerup', (event) => {
        if (Math.hypot(event.clientX - down.x, event.clientY - down.y) > 5) return
        if (Date.now() - down.at > 500) return
        const fid = pick(event)
        if (fid === null) { clearSelect(); return }
        selectFace(fid)
      })
      function tick() {
        controls.update()
        renderer.render(scene, camera)
        requestAnimationFrame(tick)
      }
      tick()
    }

    function runnerBrief() {
      return (runnerState && runnerState.brief) || {
        parting_dir: '+Z',
        gate_count: [1, 2],
        keepout_face_ids: [],
        gate_face_ids: [],
        prefer: 'fill_quality',
      }
    }

    function clearRunnerMarks() {
      for (const mesh of runnerMarks) {
        if (mesh && mesh.parent) mesh.parent.remove(mesh)
      }
      runnerMarks = []
    }

    function paintRunnerMarks() {
      clearRunnerMarks()
      if (workMode !== 'runner' || runnerView !== 'part' || !faceClusters.length) return
      const brief = runnerBrief()
      const keep = new Set(brief.keepout_face_ids || [])
      const cand = (runnerState.candidates || []).find((c) => c.id === runnerState.selected)
      const gates = new Set([...(brief.gate_face_ids || []), ...((cand && cand.gate_face_ids) || [])])
      for (const fid of gates) {
        const mesh = showFace(null, fid, 0x16a34a, 0.28)
        if (mesh) runnerMarks.push(mesh)
      }
      for (const fid of keep) {
        const mesh = showFace(null, fid, 0xdc2626, 0.26)
        if (mesh) runnerMarks.push(mesh)
      }
    }

    function persistWorkMode() {
      const url = new URL(location.href)
      if (workMode === 'runner') url.searchParams.set('work', 'runner')
      else url.searchParams.delete('work')
      history.replaceState(null, '', url)
      try { localStorage.setItem(WORK_KEY, workMode) } catch {}
    }

    function syncWorkTabs() {
      document.body.classList.toggle('work-runner', workMode === 'runner')
      document.body.classList.toggle('work-part', workMode === 'part')
      document.querySelectorAll('.sheet-tabs [data-work]').forEach((btn) => {
        btn.dataset.active = btn.dataset.work === workMode ? 'true' : 'false'
      })
      const hintEl = document.getElementById('hint')
      if (hintEl && hintEl.dataset.kind !== 'error') {
        hintEl.textContent = workMode === 'runner'
          ? (runnerView === 'mold' ? t('runnerMoldHint') : (runnerView === 'shot' ? t('runnerShotHint') : t('hintRunner')))
          : t('hint')
      }
      syncMoldButton()
    }

    async function setWorkMode(next) {
      const mode = next === 'runner' ? 'runner' : 'part'
      const prev = workMode
      workMode = mode
      persistWorkMode()
      syncWorkTabs()
      if (mode === 'runner') {
        if (!runnerPick || runnerPick === '') runnerPick = 'gate'
        await loadRunner()
        if (prev !== 'runner' && (runnerState.hasMold || runnerState.hasShot)) {
          await setRunnerView(runnerState.hasMold ? 'mold' : 'shot')
        } else {
          renderRunnerPanel()
          paintRunnerMarks()
        }
      } else {
        runnerPick = ''
        if (prev === 'runner' && runnerView !== 'part') await setRunnerView('part')
        else {
          paintRunnerMarks()
          clearSelect()
        }
      }
    }

    function toggleRunnerFace(fid) {
      const brief = { ...runnerBrief() }
      const key = runnerPick === 'keepout' ? 'keepout_face_ids' : 'gate_face_ids'
      const other = key === 'gate_face_ids' ? 'keepout_face_ids' : 'gate_face_ids'
      const list = (brief[key] || []).filter((n) => Number.isFinite(n))
      const idx = list.indexOf(fid)
      if (idx >= 0) list.splice(idx, 1)
      else list.push(fid)
      brief[key] = [...new Set(list)].sort((a, b) => a - b)
      brief[other] = (brief[other] || []).filter((id) => id !== fid)
      runnerState.brief = brief
      paintRunnerMarks()
      renderRunnerPanel()
      setStatus(t('runnerHintPick'), 'ok')
    }

    function renderRunnerPanel() {
      const box = document.getElementById('runner-panel')
      if (!box) return
      const brief = runnerBrief()
      const counts = Array.isArray(brief.gate_count) && brief.gate_count.length >= 2
        ? brief.gate_count : [1, 2]
      const cands = runnerState.candidates || []
      const selected = runnerState.selected || ''
      const qa = (runnerState.built && runnerState.built.qa) || null
      const gates = brief.gate_face_ids || []
      const keep = brief.keepout_face_ids || []
      const candHtml = cands.length
        ? cands.map((c) => {
          const active = c.id === selected ? ' data-active="true"' : ''
          const faces = (c.gate_face_ids || []).map((id) => `#${id}`).join(' ')
          const p = c.params || {}
          return `<button type="button" class="runner-card" data-kind="cand" data-cand="${esc(c.id)}"${active}>`
            + `<div class="runner-card-id">${esc(c.id)} · ${esc(c.prefer || '')}</div>`
            + `<div class="runner-card-why">${esc(c.rationale || '')}</div>`
            + `<div class="runner-card-meta">${faces || '—'} · in ${esc(p.runner_in ?? '—')} / out ${esc(p.runner_out ?? '—')}</div>`
            + `</button>`
        }).join('')
        : `<div class="runner-note">${t('runnerNoCand')}</div>`
      const qaHtml = qa && Array.isArray(qa.checks)
        ? qa.checks.map((c) => `<div class="issue-row" data-kind="${c.advisory ? 'warn' : (c.pass ? 'ok' : 'bad')}">${c.pass ? '✓' : '×'} ${esc(c.message || c.id)}</div>`).join('')
        : ''
      const params = (cands.find((c) => c.id === selected) || {}).params || (runnerState.built && runnerState.built.params) || {}
      const paramKeys = ['gate_width', 'gate_thick', 'runner_in', 'runner_out', 'biscuit_d']
      const paramHtml = paramKeys.some((k) => params[k] != null)
        ? paramKeys.filter((k) => params[k] != null).map((k) => (
          `<div class="runner-field"><label>${esc(k)}</label><input type="number" min="0.1" step="0.1" data-runner-param="${k}" value="${Number(params[k])}" /></div>`
        )).join('')
        : ''
      const pick = runnerPick || 'gate'
      box.innerHTML =
        `<div class="runner-step-h">${t('runnerStepCond')}</div>`
        + `<div class="runner-field"><label>${t('runnerParting')}</label>`
        + `<select id="runner-parting">${['+X', '-X', '+Y', '-Y', '+Z', '-Z'].map((d) =>
          `<option value="${d}"${brief.parting_dir === d ? ' selected' : ''}>${d}</option>`).join('')}</select></div>`
        + `<div class="runner-field"><label>${t('runnerGates')}</label>`
        + `<input type="number" id="runner-gate-lo" min="1" max="6" step="1" value="${counts[0]}" />`
        + `<span class="unit">–</span>`
        + `<input type="number" id="runner-gate-hi" min="1" max="6" step="1" value="${counts[1]}" /></div>`
        + `<div class="runner-field"><label>${t('runnerPrefer')}</label>`
        + `<select id="runner-prefer">`
        + `<option value="cost"${brief.prefer === 'cost' ? ' selected' : ''}>${t('runnerPreferCost')}</option>`
        + `<option value="fill_quality"${brief.prefer !== 'cost' && brief.prefer !== 'intent' ? ' selected' : ''}>${t('runnerPreferFill')}</option>`
        + `<option value="intent"${brief.prefer === 'intent' ? ' selected' : ''}>${t('runnerPreferIntent')}</option>`
        + `</select></div>`
        + `<div class="pick-modes">`
        + `<button type="button" class="ghost" data-runner-pick="inspect"${pick === 'inspect' ? ' data-active="true"' : ''}>${t('runnerPickInspect')}</button>`
        + `<button type="button" class="ghost" data-runner-pick="gate"${pick === 'gate' ? ' data-active="true"' : ''}>${t('runnerPickGate')}</button>`
        + `<button type="button" class="ghost" data-runner-pick="keepout"${pick === 'keepout' ? ' data-active="true"' : ''}>${t('runnerPickKeep')}</button>`
        + `</div>`
        + `<div class="runner-chips">${
          gates.map((id) => `<button type="button" class="runner-chip" data-kind="gate" data-face="${id}">#${id}</button>`).join('')
          + keep.map((id) => `<button type="button" class="runner-chip" data-kind="keepout" data-face="${id}">#${id}</button>`).join('')
        }</div>`
        + `<div class="runner-note">${
          runnerView === 'mold' ? t('runnerMoldHint') : (runnerView === 'shot' ? t('runnerShotHint') : t('runnerHintPick'))
        }</div>`
        + `<div class="runner-actions">`
        + `<button type="button" class="ghost" data-runner-act="save">${t('runnerSave')}</button>`
        + `</div>`
        + `<div class="runner-step-h">${t('runnerStepPropose')}</div>`
        + candHtml
        + `<div class="runner-actions">`
        + `<button type="button" class="ghost" data-runner-act="propose">${t('runnerPropose')}</button>`
        + `</div>`
        + `<div class="runner-step-h">${t('runnerStepBuild')}</div>`
        + paramHtml
        + `<div class="runner-actions">`
        + `<button type="button" class="primary" data-runner-act="build">${t('runnerBuild')}</button>`
        + `</div>`
        + `<div class="runner-step-h">${t('runnerStepCheck')}</div>`
        + `<div class="runner-actions">`
        + `<button type="button" class="ghost" data-runner-view="part"${runnerView === 'part' ? ' data-active="true"' : ''}>${t('runnerViewPart')}</button>`
        + `<button type="button" class="ghost" data-runner-view="shot"${runnerView === 'shot' ? ' data-active="true"' : ''}>${t('runnerViewShot')}</button>`
        + `<button type="button" class="ghost" data-runner-view="mold"${runnerView === 'mold' ? ' data-active="true"' : ''}>${t('runnerViewMold')}</button>`
        + `</div>`
        + (qaHtml || `<div class="runner-note">${t('runnerQa')} —</div>`)
    }

    function readRunnerForm() {
      const brief = { ...runnerBrief() }
      const parting = document.getElementById('runner-parting')
      const lo = document.getElementById('runner-gate-lo')
      const hi = document.getElementById('runner-gate-hi')
      const prefer = document.getElementById('runner-prefer')
      if (parting) brief.parting_dir = parting.value
      if (lo && hi) {
        let a = Math.max(1, Number(lo.value) || 1)
        let b = Math.max(a, Number(hi.value) || a)
        brief.gate_count = [a, Math.min(6, b)]
      }
      if (prefer) brief.prefer = prefer.value
      return brief
    }

    async function postRunner(payload) {
      const res = await fetch(base + '/runner', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name, ...payload }),
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok || data.ok === false) throw new Error(data.error || t('rebuildFail'))
      return data
    }

    async function probeGlb(rel) {
      try {
        const url = modelUrl(rel)
        let res = await fetch(url, { method: 'HEAD', cache: 'no-store' })
        if (!res.ok || !res.headers.get('content-length')) {
          res = await fetch(url, { method: 'GET', cache: 'no-store' })
        }
        return res.ok && Number(res.headers.get('content-length') || 0) >= 1024
      } catch {
        return false
      }
    }

    async function loadRunner() {
      const data = await fetchJson(base + '/runner?name=' + encodeURIComponent(name))
      const [hasShot, hasMold] = await Promise.all([
        probeGlb(`${name}.shot.glb`),
        probeGlb(`${name}.mold.glb`),
      ])
      if (!data || data.ok === false) {
        runnerState = { brief: null, candidates: [], selected: '', built: null, hasShot, hasMold, moldPreview: '' }
      } else {
        runnerState = {
          brief: data.brief || null,
          candidates: data.candidates || [],
          selected: data.selected || '',
          built: data.built || null,
          hasShot: Boolean(data.hasShot) || hasShot,
          hasMold: Boolean(data.hasMold) || hasMold,
          moldPreview: data.mold_preview || '',
        }
      }
      renderRunnerPanel()
      paintRunnerMarks()
    }

    async function setRunnerView(next, token) {
      const mine = token || ++loadingToken
      if (next === 'mold') {
        if (!runnerState.hasMold || runnerState.moldPreview !== 'split-open-5') {
          setLoading(t('runnerBusy'))
          try {
            await postRunner({ cmd: 'mold' })
            if (mine !== loadingToken) return
            await loadRunner()
          } catch (err) {
            if (mine !== loadingToken) return
            setStatus(err.message || String(err), 'error')
            renderRunnerPanel()
            return
          }
        }
        if (!runnerState.hasMold) {
          setStatus(t('runnerMoldMissing'), 'error')
          return
        }
        runnerView = 'mold'
      } else if (next === 'shot') {
        if (!runnerState.hasShot) {
          setStatus(t('runnerShotMissing'), 'error')
          return
        }
        runnerView = 'shot'
      } else {
        runnerView = 'part'
      }
      renderRunnerPanel()
      const glbPath = runnerView === 'mold'
        ? `${name}.mold.glb`
        : (runnerView === 'shot' ? `${name}.shot.glb` : await ensureGlb())
      if (mine !== loadingToken) return
      if (!glbPath) {
        clearLoading(mine)
        return
      }
      const ok = await loadGlb(mine, glbPath, runnerView === 'part', {
        fallback: runnerView === 'part',
        view: runnerView,
      })
      if (mine !== loadingToken) return
      if (!ok && runnerView !== 'part') {
        setStatus(t('runnerViewFail'), 'error')
        return
      }
      if (runnerView === 'part') {
        faceTopology = await fetchJson(base + '/models/' + name + '.topology.json')
      }
      clearLoading(mine)
      syncMoldButton()
      paintRunnerMarks()
    }

    async function runRunnerAction(act) {
      setStatus(t('runnerBusy'), '')
      try {
        if (act === 'save') {
          const brief = readRunnerForm()
          runnerState.brief = brief
          const data = await postRunner({ cmd: 'brief', ...brief })
          runnerState.brief = data.brief || brief
          setStatus(t('runnerSaved'), data.ok === false ? 'error' : 'ok')
        } else if (act === 'propose') {
          const brief = readRunnerForm()
          runnerState.brief = brief
          await postRunner({ cmd: 'brief', ...brief })
          const data = await postRunner({ cmd: 'propose' })
          runnerState.candidates = data.candidates || []
          runnerState.selected = data.selected || ''
          setStatus(t('runnerProposed'), 'ok')
        } else if (act === 'build') {
          const brief = readRunnerForm()
          runnerState.brief = brief
          await postRunner({ cmd: 'brief', ...brief })
          if (!(runnerState.candidates || []).length) {
            const proposed = await postRunner({ cmd: 'propose' })
            runnerState.candidates = proposed.candidates || []
            runnerState.selected = proposed.selected || runnerState.selected
          }
          const params = {}
          document.querySelectorAll('[data-runner-param]').forEach((input) => {
            const n = Number(input.value)
            if (Number.isFinite(n)) params[input.dataset.runnerParam] = n
          })
          let data
          if (Object.keys(params).length) {
            data = await postRunner({ cmd: 'apply', params: { ...params, candidate: runnerState.selected } })
          } else {
            data = await postRunner({ cmd: 'build', candidate: runnerState.selected })
          }
          runnerState.hasShot = true
          runnerState.built = {
            candidate: data.selected,
            params: (data.candidate && data.candidate.params) || params,
            qa: data.qa,
          }
          if (data.selected) runnerState.selected = data.selected
          setStatus(t('runnerBuilt'), data.qa && data.qa.pass === false ? 'error' : 'ok')
          await loadRunner()
          await setRunnerView(runnerState.hasMold ? 'mold' : 'shot')
          return
        }
        renderRunnerPanel()
        paintRunnerMarks()
      } catch (err) {
        setStatus(err.message || String(err), 'error')
        renderRunnerPanel()
      }
    }

    async function loadGlb(token, glbPath, keepView = false, opts = {}) {
      ensureScene()
      if (modelRoot) { scene.remove(modelRoot) }
      if (highlight) { scene.remove(highlight); highlight = null }
      if (hoverMesh) { scene.remove(hoverMesh); hoverMesh = null }
      let gltf
      let path = glbPath || partsCatalog.find((item) => item.name === name)?.glbPath || `${name}.glb`
      try {
        gltf = await new GLTFLoader().loadAsync(modelUrl(path) + '?t=' + Date.now())
      } catch (err) {
        if (opts.fallback === false) return false
        // A broken or absent GLB: ask the host to rebuild it, then retry once.
        const regenerated = await ensureGlb()
        if (token !== loadingToken || !regenerated) return false
        path = regenerated
        gltf = await new GLTFLoader().loadAsync(modelUrl(path) + '?t=' + Date.now())
      }
      if (token !== loadingToken) return false
      modelRoot = gltf.scene
      scene.add(modelRoot)
      if (!keepView) {
        fitCamera(modelRoot)
        if (opts.view === 'mold') {
          showEdges = true
          setMoldCamera()
        } else {
          setView('iso')
        }
      }
      selected = null
      featureSel = null
      buildEdgeLines()
      syncModelAndClusters()
      syncDisplayToggles()
      renderFaceInfo()
      paintRunnerMarks()
      clearLoading(token)
      return true
    }

    async function loadParams() {
      const res = await fetch(base + '/params?name=' + encodeURIComponent(name), { cache: 'no-store' })
      const data = res.ok ? await res.json() : {}
      allParams = data.values || {}
      if (allParams.length && allParams.width && allParams.height) {
        baseline = { length: allParams.length, width: allParams.width, height: allParams.height }
      }
      renderParamList()
      renderArtifacts()
      syncChrome()
      faceTopology = await fetchJson(base + '/models/' + name + '.topology.json')
      await loadRunner()
      await Promise.all([renderIssues(), renderTree(), renderMetadata(), renderAdvice()])
    }

    async function showPart(next, stamp) {
      if (!next || next === name && stamp === lastStamp && modelRoot) return
      const switching = next !== name
      const token = ++loadingToken
      name = next
      if (stamp) lastStamp = stamp
      const url = new URL(location.href)
      url.searchParams.set('name', name)
      if (workMode === 'runner') url.searchParams.set('work', 'runner')
      else url.searchParams.delete('work')
      history.replaceState(null, '', url)
      clearSelect()
      if (switching) {
        runnerPick = workMode === 'runner' ? 'gate' : ''
        runnerView = 'part'
      }
      syncChrome()
      const keepMesh = Boolean(modelRoot) && !switching
      if (!keepMesh) setLoading(t('loading'))
      setStatus(t('opening', { name }), '')
      try {
        await loadParams()
        if (token !== loadingToken) return
        if (workMode === 'runner' && (switching || !modelRoot) && runnerView === 'part') {
          if (runnerState.hasMold) runnerView = 'mold'
          else if (runnerState.hasShot) runnerView = 'shot'
        }
        const glbPath = (workMode === 'runner' && runnerView === 'mold' && runnerState.hasMold)
          ? `${name}.mold.glb`
          : ((workMode === 'runner' && runnerView === 'shot' && runnerState.hasShot)
            ? `${name}.shot.glb`
            : await ensureGlb())
        if (token !== loadingToken) return
        if (!glbPath) {
          setLoading(t('previewMissing'))
          setStatus(t('previewUnavailable'), 'error')
          return
        }
        await loadGlb(token, glbPath, keepMesh, { view: runnerView })
        if (token !== loadingToken) return
        clearLoading(token)
        setStatus(t('loaded', { name }), 'ok')
      } catch (err) {
        if (token !== loadingToken) return
        setLoading(err.message || String(err))
        setStatus(t('loadFail'), 'error')
      }
    }

    async function fillPartsSelect(names) {
      const list = names || []
      if (name && !list.includes(name)) list.unshift(name)
      const key = list.join('|')
      if (partsSelect.dataset.key === key) return
      partsSelect.dataset.key = key
      partsSelect.innerHTML = list.map((item) => '<option value="' + item + '">' + item + '</option>').join('')
      partsSelect.value = name
    }

    async function pollLatest() {
      try {
        const [latestRes, catalog, tree] = await Promise.all([
          fetch(base + '/latest', { cache: 'no-store' }),
          fetchCatalog(),
          fetchTree(),
        ])
        partsCatalog = normalizeCatalog(catalog).parts
        fileTree = tree
        await fillPartsSelect(normalizeCatalog(catalog).names)
        renderFileTree()
        const latest = latestRes.ok ? await latestRes.json() : {}
        const stamp = Number(latest.updatedAt) || 0
        if (latest.name && stamp && stamp !== lastStamp) {
          // In the dsh pane the parent iframe owns navigation. Reloading a
          // different stem here races the user click and leaves 加载中 up.
          const paneLocked = document.body.classList.contains('panel') || document.body.classList.contains('embed')
          if (paneLocked && latest.name !== name) return
          await showPart(latest.name, stamp)
        }
      } catch (err) {}
    }

    fileTreeEl.addEventListener('click', (event) => {
      const toggle = event.target.closest('[data-dir]')
      if (toggle) {
        const dir = toggle.dataset.dir
        if (expandedDirs.has(dir)) expandedDirs.delete(dir)
        else expandedDirs.add(dir)
        renderFileTree()
        return
      }
      const file = event.target.closest('[data-stem]')
      if (!file) return
      showPart(file.dataset.stem, lastStamp)
    })

    paramList.addEventListener('click', (event) => {
      const row = event.target.closest('[data-feature]')
      if (!row) return
      selectParam(row.dataset.feature)
    })

    const treeBox = document.getElementById('tree')
    if (treeBox) treeBox.addEventListener('click', (event) => {
      const row = event.target.closest('[data-face]')
      if (!row) return
      const fid = Number(row.dataset.face)
      if (Number.isFinite(fid)) selectFace(fid)
    })

    const workTabs = document.querySelector('.sheet-tabs')
    if (workTabs) workTabs.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-work]')
      if (!btn) return
      void setWorkMode(btn.getAttribute('data-work'))
    })

    const runnerBox = document.getElementById('runner-panel')
    if (runnerBox) runnerBox.addEventListener('click', (event) => {
      const pickBtn = event.target.closest('[data-runner-pick]')
      if (pickBtn) {
        runnerPick = pickBtn.getAttribute('data-runner-pick') || 'inspect'
        if ((runnerPick === 'gate' || runnerPick === 'keepout') && runnerView !== 'part') {
          void setRunnerView('part')
        } else renderRunnerPanel()
        return
      }
      const viewBtn = event.target.closest('[data-runner-view]')
      if (viewBtn) {
        event.preventDefault()
        void setRunnerView(viewBtn.getAttribute('data-runner-view'))
        return
      }
      const candBtn = event.target.closest('[data-cand]')
      if (candBtn) {
        runnerState.selected = candBtn.getAttribute('data-cand') || ''
        renderRunnerPanel()
        paintRunnerMarks()
        return
      }
      const faceChip = event.target.closest('.runner-chip[data-face]')
      if (faceChip) {
        const fid = Number(faceChip.getAttribute('data-face'))
        if (Number.isFinite(fid)) {
          runnerPick = faceChip.getAttribute('data-kind') === 'keepout' ? 'keepout' : 'gate'
          toggleRunnerFace(fid)
        }
        return
      }
      const act = event.target.closest('[data-runner-act]')
      if (act) void runRunnerAction(act.getAttribute('data-runner-act'))
    })

    const adviceBox = document.getElementById('advice')
    if (adviceBox) adviceBox.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-advice-id]')
      if (!btn) return
      const item = lastAdviceItems.find((it) => it && it.id === btn.getAttribute('data-advice-id'))
      if (!item || !item.prompt) return
      btn.disabled = true
      try {
        window.parent.postMessage({
          type: 'easycad:run-advice',
          name,
          id: item.id,
          title: item.title,
          prompt: item.prompt,
        }, '*')
      } catch {}
      setTimeout(() => { btn.disabled = false }, 1200)
    })

    document.querySelectorAll('[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view))
    })
    document.getElementById('reset-view').addEventListener('click', () => {
      if (modelRoot) fitCamera(modelRoot)
      if (runnerView === 'mold') setMoldCamera()
      else setView('iso')
    })
    const viewMoldBtn = document.getElementById('view-mold')
    if (viewMoldBtn) viewMoldBtn.addEventListener('click', () => {
      void setWorkMode('runner').then(() => setRunnerView('mold'))
    })

    let scaleTimer = 0
    // Every number input in the batch card drives a cheap live-preview scale; the
    // expensive face-cluster rebuild is deferred until the user pauses typing.
    batchFieldsEl.addEventListener('input', (event) => {
      const input = event.target.closest('input[data-param]')
      if (!input) return
      const param = input.dataset.param
      const spec = FEATURES[param]
      if (!spec) return
      const next = Number(input.value)
      if (!Number.isFinite(next)) return
      allParams[spec.id] = next
      updateModelScale()
      if (scaleTimer) clearTimeout(scaleTimer)
      scaleTimer = setTimeout(applyPreviewScale, 200)
      syncChrome()
    })

    const edgeToggle = document.getElementById('toggle-edges')
    if (edgeToggle) edgeToggle.addEventListener('click', toggleEdges)
    const gridToggle = document.getElementById('toggle-grid')
    if (gridToggle) gridToggle.addEventListener('click', toggleGrid)

    document.getElementById('clear').addEventListener('click', clearSelect)
    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault()
      // Read every editable field in the batch card into the params payload.
      let touched = false
      batchFieldsEl.querySelectorAll('input[data-param]').forEach((input) => {
        const param = input.dataset.param
        const spec = FEATURES[param]
        if (!spec) return
        const next = Number(input.value)
        if (!Number.isFinite(next)) return
        allParams[spec.id] = next
        touched = true
      })
      if (!touched) return
      applyBtn.disabled = true
      setStatus(t('rebuilding'), '')
      try {
        const res = await fetch(base + '/apply', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name, params: allParams }),
        })
        const data = await res.json()
        if (!res.ok || data.ok === false) throw new Error(data.error || t('rebuildFail'))
        if (data.params && data.params.values) allParams = data.params.values
        if (allParams.length && allParams.width && allParams.height) {
          baseline = { length: allParams.length, width: allParams.width, height: allParams.height }
        }
        const catalog = await fetchCatalog()
        partsCatalog = normalizeCatalog(catalog).parts
        fileTree = await fetchTree()
        await loadGlb(++loadingToken, undefined, true)
        renderParamList()
        renderBatchFields(featureSel && FEATURES[featureSel] && allParams[FEATURES[featureSel].id] != null ? featureSel : null)
        renderFaceInfo()
        syncChrome()
        await Promise.all([renderIssues(), renderTree(), renderMetadata(), renderAdvice()])
        setStatus(t('paramsUpdated'), 'ok')
      } catch (err) {
        setStatus(err.message || String(err), 'error')
      } finally {
        applyBtn.disabled = false
      }
    })

    partsSelect.addEventListener('change', () => { showPart(partsSelect.value, lastStamp) })

    function applyLocale(next) {
      locale = next === 'en' ? 'en' : 'zh'
      refreshFeatureCopy()
      applyStaticI18n()
      if (document.body.classList.contains('bare') && inspectorEmpty && inspectorEdit && inspectorEdit.hidden) {
        inspectorEmpty.textContent = t('pickFaceToEdit')
      } else if (inspectorEmpty && inspectorEdit && inspectorEdit.hidden) {
        inspectorEmpty.textContent = t('editEmpty')
      }
      renderParamList()
      renderFaceInfo()
      renderArtifacts()
      renderFileTree()
      syncDisplayToggles()
      if (featureSel) selectParam(featureSel)
      renderRunnerPanel()
      syncWorkTabs()
      void Promise.all([renderIssues(), renderTree(), renderMetadata(), renderAdvice()])
    }

    window.addEventListener('message', (event) => {
      const data = event && event.data
      if (!data || data.type !== 'easycad:locale') return
      applyLocale(data.locale)
    })
    window.addEventListener('storage', (event) => {
      if (event.key !== LOCALE_KEY) return
      applyLocale(event.newValue)
    })

    const [initial, tree] = await Promise.all([resolveInitialPart(), fetchTree()])
    fileTree = tree
    for (const node of fileTree) {
      if (node.kind === 'dir') expandedDirs.add(node.path)
    }
    partsCatalog = partsCatalog.length ? partsCatalog : normalizeCatalog(await fetchCatalog()).parts
    await fillPartsSelect(partsCatalog.map((row) => row.name))
    lastStamp = initial.stamp || 0
    renderFileTree()
    await showPart(initial.name, lastStamp)
    setInterval(pollLatest, 2500)
  </script>
</body>
</html>
