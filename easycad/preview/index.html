<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyCAD</title>
  <style>
    :root {
      color-scheme: light;
      --ec-bg: #f4f5f7;
      --ec-panel: #fff;
      --ec-border: #e3e6ea;
      --ec-muted: #6b7280;
      --ec-text: #111827;
      --ec-accent: #2563eb;
      --ec-viewport: #eceff3;
      --ec-parts-w: 208px;
      --ec-sheet-w: 280px;
      --ec-topbar-h: 40px;
      --ec-status-h: 26px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
      background: var(--ec-bg);
      color: var(--ec-text);
    }
    .workbench { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      display: flex; align-items: center; gap: 10px;
      height: var(--ec-topbar-h); padding: 0 10px;
      background: var(--ec-panel); border-bottom: 1px solid var(--ec-border);
      flex-shrink: 0;
    }
    .brand { font-weight: 650; font-size: 13px; }
    .crumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--ec-muted); min-width: 0;
    }
    .crumb strong {
      color: var(--ec-text); font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dims-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px; color: var(--ec-muted);
      padding: 2px 8px; border: 1px solid var(--ec-border);
      border-radius: 999px; background: var(--ec-bg);
    }
    .spacer { flex: 1; }
    .main { display: flex; flex: 1; min-height: 0; }
    .parts-panel, .sheet-panel {
      background: var(--ec-panel);
      border-color: var(--ec-border);
      flex-shrink: 0;
      overflow: auto;
    }
    .parts-panel {
      width: var(--ec-parts-w);
      border-right: 1px solid var(--ec-border);
    }
    .sheet-panel {
      width: var(--ec-sheet-w);
    }
    .sheet-resize-grip {
      width: 12px; flex-shrink: 0; cursor: col-resize; touch-action: none;
      background: var(--ec-panel);
      border-left: 1px solid var(--ec-border);
      border-right: 1px solid var(--ec-border);
      position: relative; z-index: 1;
      transition: background .12s ease;
    }
    .sheet-resize-grip:hover,
    .sheet-resize-grip[data-dragging="true"] { background: #f4f6f8; }
    .sheet-resize-grip::after {
      content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px;
      background: transparent; transition: background .12s ease;
    }
    .sheet-resize-grip:hover::after,
    .sheet-resize-grip[data-dragging="true"]::after { background: #4c7fd4; }
    .panel-head {
      position: sticky; top: 0; z-index: 1;
      padding: 8px 10px 6px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--ec-muted);
      background: var(--ec-panel);
      border-bottom: 1px solid var(--ec-border);
    }
    .tree-root { padding: 4px 0 8px; font-size: 12px; }
    .tree-node { width: 100%; }
    .tree-row {
      display: flex; align-items: center; gap: 4px;
      width: 100%; min-height: 26px; padding: 2px 6px 2px 0;
      border: 0; background: transparent; color: var(--ec-text);
      font: inherit; text-align: left; cursor: pointer;
    }
    .tree-row:hover { background: var(--ec-bg); }
    .tree-row[data-active="true"] { background: #eff6ff; box-shadow: inset 3px 0 0 var(--ec-accent); }
    .tree-toggle {
      width: 18px; height: 18px; border: 0; background: transparent;
      color: var(--ec-muted); cursor: pointer; flex-shrink: 0; font-size: 10px;
    }
    .tree-icon {
      width: 14px; text-align: center; flex-shrink: 0;
      color: var(--ec-muted); font-size: 10px;
    }
    .tree-label {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 11px;
    }
    .tree-label[data-kind="dir"] { font-weight: 600; color: var(--ec-text); }
    .tree-label[data-kind="file"] { color: #374151; }
    .tree-children { margin-left: 10px; border-left: 1px solid var(--ec-border); }
    .tree-empty { padding: 8px 10px; color: var(--ec-muted); font-size: 11px; }
    .viewport-area {
      flex: 1; min-width: 0; position: relative;
      background: var(--ec-viewport);
    }
    #view { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; text-align: center;
      color: var(--ec-muted);
      background: rgb(236 239 243 / 72%);
      backdrop-filter: blur(1px);
      pointer-events: none;
    }
    .overlay[hidden] { display: none !important; }
    .viewport-hint {
      position: absolute; left: 10px; bottom: 10px; z-index: 1;
      color: var(--ec-muted); font-size: 11px; pointer-events: none;
    }
    .viewport-hint[data-kind="error"] { color: #dc2626; font-weight: 600; }
    .overlay[data-kind="error"] { color: #dc2626; }
    .viewport-toolbar {
      position: absolute; right: 10px; bottom: 10px; z-index: 1;
      display: flex; gap: 4px; padding: 4px;
      background: rgb(255 255 255 / 92%);
      border: 1px solid var(--ec-border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgb(17 24 39 / 6%);
    }
    .viewport-toolbar button {
      border: 1px solid transparent; border-radius: 6px;
      background: transparent; color: var(--ec-text);
      padding: 4px 8px; font: inherit; font-size: 11px; cursor: pointer;
    }
    .viewport-toolbar button:hover { background: var(--ec-bg); border-color: var(--ec-border); }
    .viewport-toolbar button[data-active="true"] {
      background: #eff6ff; border-color: #bfdbfe; color: var(--ec-accent);
    }
    .section {
      border-bottom: 1px solid var(--ec-border);
    }
    .section summary {
      list-style: none; cursor: pointer;
      padding: 8px 10px; font-size: 12px; font-weight: 600;
      color: var(--ec-text);
    }
    .section summary::-webkit-details-marker { display: none; }
    .section summary::after {
      content: "▾"; float: right; color: var(--ec-muted); font-size: 11px;
    }
    .section:not([open]) summary::after { content: "▸"; }
    .section-body { padding: 0 0 8px; }
    .sec-badge {
      float: right; border-radius: 999px; padding: 0 7px;
      font-size: 10px; font-weight: 600; color: #fff; background: #6b7280;
    }
    .sec-badge[data-kind="warn"] { background: #d97706; }
    .sec-badge[data-kind="ok"] { background: #15803d; }
    .param-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 6px 10px; cursor: pointer;
    }
    .param-row:hover { background: var(--ec-bg); }
    .param-row[data-active="true"] { background: #eff6ff; }
    .param-label { font-size: 11px; color: var(--ec-muted); }
    .param-value {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px; padding: 2px 6px;
      border-radius: 4px; background: var(--ec-bg); color: var(--ec-muted);
    }
    .info-empty { padding: 8px 10px; color: var(--ec-muted); font-size: 11px; line-height: 1.5; }
    .info-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 4px 10px; font-size: 11px; color: var(--ec-text);
    }
    .info-val {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px; padding: 1px 5px; border-radius: 4px;
      background: var(--ec-bg); color: var(--ec-muted); text-align: right;
    }
    .issue-row {
      display: flex; align-items: center; gap: 6px; padding: 4px 10px;
      font-size: 11px; color: var(--ec-muted); border-radius: 6px;
    }
    .issue-row[data-kind="ok"] { color: #15803d; }
    .issue-row[data-kind="bad"] { color: #c62828; }
    .issue-row[data-kind="warn"] { color: #b45309; background: #fef3c7; margin: 2px 6px; padding: 5px 8px; }
    .advice-item { padding: 2px 10px; font-size: 11px; color: var(--ec-text); line-height: 1.55; }
    .advice-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--ec-border);
    }
    .advice-row:last-child { border-bottom: 0; }
    .advice-copy { flex: 1; min-width: 0; }
    .advice-title { font-size: 12px; font-weight: 650; color: var(--ec-text); }
    .advice-text { font-size: 11px; color: var(--ec-muted); margin-top: 2px; line-height: 1.45; }
    .advice-run {
      flex-shrink: 0; border: 0; border-radius: 6px;
      background: var(--ec-accent); color: #fff;
      padding: 5px 9px; font: inherit; font-size: 11px; cursor: pointer;
    }
    .advice-run:hover { background: #1d4ed8; }
    .advice-run:disabled { background: #93c5fd; cursor: wait; }
    .tree-item { padding: 3px 10px; font-size: 11px; color: var(--ec-text); cursor: pointer; user-select: none; -webkit-user-select: none; }
    .tree-item:hover { background: #f4f5f7; }
    .tree-root { font-weight: 650; }
    .tree-count { float: right; font-size: 10px; font-weight: 500; color: #6b7280; }
    .tree-leaf { padding-left: 22px; color: #374151; }
    .tree-active { background: #eff6ff; box-shadow: inset 3px 0 0 #2563eb; }
    .artifact-list { padding: 0 10px 4px; }
    .artifact-list a {
      display: block; color: var(--ec-accent); text-decoration: none;
      padding: 3px 0; font-size: 11px; word-break: break-all;
    }
    .artifact-list a:hover { text-decoration: underline; }
    .inspector-empty {
      padding: 8px 10px; color: var(--ec-muted); font-size: 11px; line-height: 1.5;
    }
    .inspector-kicker {
      padding: 0 10px; font-size: 10px; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--ec-muted);
    }
    .inspector-title {
      padding: 2px 10px 0; font-size: 14px; font-weight: 650;
    }
    .inspector-hint {
      padding: 2px 10px 8px; color: var(--ec-muted); font-size: 11px;
    }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 10px 8px; }
    input[type="number"] {
      width: 88px; border: 1px solid var(--ec-border);
      border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 11px;
    }
    input[type="number"]:focus {
      outline: 2px solid #bfdbfe; border-color: #60a5fa;
    }
    .unit { color: #9ca3af; font-size: 11px; }
    .batch-fields { padding: 0 10px 2px; }
    .batch-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; }
    .batch-row label {
      width: 64px; flex-shrink: 0; font-size: 11px; color: var(--ec-muted);
    }
    .batch-row .batch-hint {
      flex: 1; min-width: 0; font-size: 10px; color: #9ca3af; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .batch-row input[type="number"] { width: 72px; }
    .batch-row[data-active="true"] input { border-color: #60a5fa; box-shadow: 0 0 0 1px #bfdbfe; }
    button.primary {
      border: 0; border-radius: 6px; background: var(--ec-accent);
      color: #fff; padding: 5px 10px; font: inherit; font-size: 11px; cursor: pointer;
    }
    button.primary:hover { background: #1d4ed8; }
    button.primary:disabled { background: #93c5fd; cursor: wait; }
    button.ghost {
      border: 1px solid var(--ec-border); border-radius: 6px;
      background: #fff; color: var(--ec-text);
      padding: 5px 10px; font: inherit; font-size: 11px; cursor: pointer;
    }
    button.ghost:hover { background: var(--ec-bg); }
    .runner-field {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; font-size: 11px;
    }
    .runner-field label { width: 64px; flex-shrink: 0; color: var(--ec-muted); }
    .runner-field select, .runner-field input[type="number"] {
      flex: 1; min-width: 0; border: 1px solid var(--ec-border);
      border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 11px;
      background: #fff;
    }
    .runner-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 10px 6px; }
    .runner-chip {
      border: 1px solid var(--ec-border); border-radius: 999px;
      background: var(--ec-bg); color: var(--ec-text);
      padding: 2px 8px; font: inherit; font-size: 10px; cursor: pointer;
    }
    .runner-chip[data-kind="gate"] { background: #ecfdf5; border-color: #86efac; color: #166534; }
    .runner-chip[data-kind="keepout"] { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .runner-chip[data-kind="cand"][data-active="true"] {
      background: #eff6ff; border-color: #93c5fd; color: var(--ec-accent);
    }
    .runner-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 10px 8px; }
    .runner-note { padding: 2px 10px 8px; font-size: 10px; color: var(--ec-muted); line-height: 1.45; }
    .pick-modes { display: flex; gap: 4px; padding: 4px 10px 6px; }
    .pick-modes button[data-active="true"],
    .runner-actions button[data-active="true"] {
      background: #eff6ff; border-color: #93c5fd; color: var(--ec-accent);
    }
    .runner-actions button { min-height: 28px; }
    .statusbar {
      height: var(--ec-status-h);
      display: flex; align-items: center; padding: 0 10px;
      font-size: 11px; color: var(--ec-muted);
      background: var(--ec-panel); border-top: 1px solid var(--ec-border);
      flex-shrink: 0;
    }
    .statusbar[data-kind="error"] { color: #dc2626; }
    .statusbar[data-kind="ok"] { color: #15803d; }
    body.embed { --ec-parts-w: 176px; --ec-sheet-w: 220px; }
    body.embed .brand, body.embed .statusbar { display: none; }
    body.embed .crumb { display: none; }
    body.embed .topbar select { max-width: 120px; }
    /* bare mode: only the 3D viewport; side panels move into the dsh overlay */
    body.bare .topbar, body.bare .statusbar,
    body.bare .parts-panel, body.bare .sheet-panel { display: none; }
    body.bare .sheet-resize-grip { display: none; }
    body.bare .viewport-area { flex: 1; }
    .floating-edit {
      position: absolute; left: 12px; bottom: 46px; z-index: 3;
      width: 232px; max-width: calc(100% - 24px);
      background: var(--ec-panel); border: 1px solid var(--ec-border);
      border-radius: 10px; padding: 8px 10px;
      box-shadow: 0 4px 16px rgb(17 24 39 / 12%);
    }
    .floating-edit[hidden] { display: none; }
    /* panel mode: 3D viewport + parametric panel on the right */
    body.panel { --ec-sheet-w: 248px; }
    body.panel .topbar, body.panel .statusbar,
    body.panel .parts-panel { display: none; }
    body.panel .viewport-area { flex: 1; }
    body.work-runner { --ec-sheet-w: 288px; }
    body.panel.work-runner, body.embed.work-runner { --ec-sheet-w: 288px; }
    .sheet-panel { display: flex; flex-direction: column; }
    .sheet-tabs {
      display: flex; flex-shrink: 0; position: sticky; top: 0; z-index: 2;
      background: var(--ec-panel); border-bottom: 1px solid var(--ec-border);
    }
    .sheet-tabs button {
      flex: 1; border: 0; border-bottom: 2px solid transparent;
      background: transparent; color: var(--ec-muted);
      padding: 9px 6px 8px; font: inherit; font-size: 12px; font-weight: 650;
      cursor: pointer;
    }
    .sheet-tabs button:hover { background: var(--ec-bg); color: var(--ec-text); }
    .sheet-tabs button[data-active="true"] {
      color: var(--ec-accent); border-bottom-color: var(--ec-accent); background: #eff6ff;
    }
    .work-pane { flex: 1; min-height: 0; overflow: auto; }
    body.work-part #work-runner { display: none; }
    body.work-runner #work-part { display: none; }
    .runner-step-h {
      padding: 8px 10px 2px; font-size: 10px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--ec-muted);
    }
    .runner-card {
      margin: 4px 8px; padding: 7px 8px; border: 1px solid var(--ec-border);
      border-radius: 8px; background: #fff; cursor: pointer; text-align: left;
      font: inherit; width: calc(100% - 16px);
    }
    .runner-card:hover { background: var(--ec-bg); }
    .runner-card[data-active="true"] { border-color: #93c5fd; background: #eff6ff; }
    .runner-card-id { font-size: 12px; font-weight: 700; color: var(--ec-text); }
    .runner-card-why { font-size: 11px; color: var(--ec-muted); margin-top: 2px; line-height: 1.4; }
    .runner-card-meta { font-size: 10px; color: #6b7280; margin-top: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="workbench">
    <header class="topbar">
      <div class="brand">EasyCAD</div>
      <nav class="crumb" aria-label="路径" data-i18n-aria="crumbAria">
        <span>models</span><span>/</span><strong id="crumb-name">—</strong>
      </nav>
      <select id="parts" aria-label="零件" data-i18n-aria="partsAria"></select>
      <div class="dims-badge" id="dims">—</div>
      <div class="spacer"></div>
    </header>
    <div class="main">
      <aside class="parts-panel" id="parts-panel">
        <div class="panel-head">models</div>
        <div class="tree-root" id="file-tree"></div>
      </aside>
      <section class="viewport-area">
        <div id="view">
          <div class="overlay" id="status" hidden data-i18n="loading">加载中…</div>
          <div class="viewport-hint" id="hint" data-i18n="hint">点选面或参数 · 拖动旋转</div>
          <div class="viewport-toolbar" role="group" aria-label="视图" data-i18n-aria="viewAria">
            <button type="button" data-view="iso" data-active="true" data-i18n="viewIso">等轴</button>
            <button type="button" data-view="front" data-i18n="viewFront">正视</button>
            <button type="button" data-view="top" data-i18n="viewTop">俯视</button>
            <button type="button" data-view="right" data-i18n="viewRight">右视</button>
            <button type="button" class="ghost" id="view-mold" hidden data-i18n="runnerViewMold">型腔</button>
            <button type="button" class="ghost" id="reset-view" data-i18n="viewReset">重置</button>
          </div>
          <div class="floating-edit" id="floating-edit" hidden></div>
        </div>
      </section>
      <div class="sheet-resize-grip" id="sheet-grip" title="拖动调整面板宽度" data-i18n-title="resizeSheet" role="separator" aria-orientation="vertical"></div>
      <aside class="sheet-panel" id="sheet">
        <div class="sheet-tabs" role="tablist" aria-label="工作台" data-i18n-aria="workTabsAria">
          <button type="button" role="tab" data-work="part" data-active="true" data-i18n="workPart">零件</button>
          <button type="button" role="tab" data-work="runner" data-i18n="workRunner">流道系统</button>
        </div>
        <div id="work-part" class="work-pane">
        <details class="section" open>
          <summary data-i18n="secAdvice">AI 建议</summary>
          <div class="section-body" id="advice"><div class="info-empty" data-i18n="adviceEmpty">暂无待执行项。通过质检后可导出，失败项会列在这里。</div></div>
        </details>
        <details class="section" open>
          <summary>Issues <span class="sec-badge" id="issues-badge"></span></summary>
          <div class="section-body" id="issues"><div class="info-empty">—</div></div>
        </details>
        <details class="section">
          <summary>Tree</summary>
          <div class="section-body" id="tree"><div class="info-empty">—</div></div>
        </details>
        <details class="section" open>
          <summary data-i18n="secParams">Parameters</summary>
          <div class="section-body" id="param-list"></div>
        </details>
        <details class="section" open>
          <summary data-i18n="secFace">选中面</summary>
          <div class="section-body" id="face-info"><div class="info-empty" data-i18n="faceEmpty">在 3D 视图中点选一个面。</div></div>
        </details>
        <details class="section" open>
          <summary data-i18n="secEdit">编辑</summary>
          <div class="section-body">
            <div class="inspector-empty" id="inspector-empty" data-i18n="editEmpty">选中面或参数行来改尺寸。</div>
            <div id="inspector-edit" hidden>
              <div class="inspector-kicker" data-i18n="editKicker">编辑尺寸 · 多个参数</div>
              <div class="inspector-title" id="card-title"></div>
              <div class="inspector-hint" id="card-hint"></div>
              <div class="batch-fields" id="batch-fields"></div>
              <form id="form" class="row">
                <button type="submit" class="primary" id="apply" data-i18n="apply">应用</button>
                <button type="button" class="ghost" id="clear" data-i18n="cancel">取消</button>
              </form>
            </div>
          </div>
        </details>
        <details class="section" open>
          <summary data-i18n="secMeta">Metadata</summary>
          <div class="section-body" id="metadata"><div class="info-empty">—</div></div>
          <div class="section-body artifact-list" id="artifacts"></div>
        </details>
        </div>
        <div id="work-runner" class="work-pane">
          <div class="runner-bench" id="runner-panel"><div class="info-empty" data-i18n="runnerEmpty">导入或生成零件后，可在此设分型、点面、提议并生成浇注系统。</div></div>
          <details class="section" open>
            <summary data-i18n="secFace">选中面</summary>

    let locale = 'zh'

    if (query.get('bare') === '1') {
      document.body.classList.add('bare')
      // Move the edit inspector out of the hidden sheet into a floating card in the viewport.
      const floatBox = document.getElementById('floating-edit')
      const empty = document.getElementById('inspector-empty')

    // Make the right inspection panel (sheet) resizable by dragging its left edge.
    const sheetEl = document.getElementById('sheet')
    const sheetGrip = document.getElementById('sheet-grip')
    if (sheetEl && sheetGrip) {
      const KEY = 'easycad:sheet-width'
      const MIN = 220
      const MAX = 680
      let saved = NaN
      try { saved = Number(localStorage.getItem(KEY)) } catch {}
      if (Number.isFinite(saved) && saved >= MIN && saved <= MAX) {
        sheetEl.style.setProperty('--ec-sheet-w', `${Math.round(saved)}px`)
      }
      const readWidth = () => parseFloat(getComputedStyle(sheetEl).width) || 248
      let dragging = false
      let startX = 0
      let startW = 0
      const onDown = (event) => {
        dragging = true
        startX = event.clientX
        startW = readWidth()
        sheetGrip.dataset.dragging = 'true'
        sheetGrip.setPointerCapture(event.pointerId)
        event.preventDefault()
      }
      const onMove = (event) => {
        if (!dragging) return
        const next = Math.min(MAX, Math.max(MIN, Math.round(startW - (event.clientX - startX))))
        sheetEl.style.setProperty('--ec-sheet-w', `${next}px`)
      }
      const onUp = (event) => {
        if (!dragging) return
        dragging = false
        sheetGrip.dataset.dragging = 'false'
        try { sheetGrip.releasePointerCapture(event.pointerId) } catch {}
        const next = parseInt(sheetEl.style.getPropertyValue('--ec-sheet-w'), 10) || readWidth()
        try { localStorage.setItem(KEY, String(Math.round(next))) } catch {}
      }
      sheetGrip.addEventListener('pointerdown', onDown)
      sheetGrip.addEventListener('pointermove', onMove)
      sheetGrip.addEventListener('pointerup', onUp)
      sheetGrip.addEventListener('pointercancel', onUp)
    }

      statusbar.textContent = text || t('ready')
      statusbar.dataset.kind = kind || ''
      const hintEl = document.getElementById('hint')
      if (kind === 'error') {
        status.hidden = false
        status.textContent = text || t('loadFail')
        status.dataset.kind = 'error'
        if (hintEl) {
          hintEl.textContent = text || t('loadFail')
          hintEl.dataset.kind = 'error'
        }
      } else {
        if (status.dataset.kind === 'error') {
          status.hidden = true
          status.dataset.kind = ''
        }
        if (hintEl && hintEl.dataset.kind === 'error') {
          hintEl.dataset.kind = ''
          hintEl.textContent = workMode === 'runner'

            : t('hint')
        }
      }
    }

    function setLoading(text) {
      status.hidden = false
      status.textContent = text || t('loading')
      status.dataset.kind = ''
    }

    function clearLoading(token) {
      if (token != null && token !== loadingToken) return
      status.hidden = true
      if (status.dataset.kind === 'error') status.dataset.kind = ''
    }

    function dimText() {
      const L = allParams.length, W = allParams.width, H = allParams.height, D = allParams.hole_d
      if (!L || !W || !H) return '—'
      return D ? `${L} × ${W} × ${H} · ⌀${D} mm` : `${L} × ${W} × ${H} mm`
    }

    function normalizeCatalog(raw) {
      const names = Array.isArray(raw?.names) ? raw.names : []
      let parts = Array.isArray(raw?.parts) ? raw.parts : []
      if (!parts.length && names.length) {
        parts = names.map((item) => ({
          name: item,
          hasScript: false,
          hasStep: false,
          hasGlb: false,
          hasIr: false,
        }))
      }
      return { names, parts }
    }

    function fileIcon(node) {
      if (node.kind === 'dir') return '▸'
      if (/\.(step|stp)$/i.test(node.name)) return 'S'
      if (/\.glb$/i.test(node.name)) return 'G'
      if (node.name.endsWith('.step.py')) return 'Py'
      if (/\.(ir|brief)\.json$/i.test(node.name)) return '{}'
      return '·'
    }

    function renderTreeNodes(nodes, depth = 0) {
      return nodes.map((node) => {
        if (node.kind === 'dir') {
          const open = expandedDirs.has(node.path)
          return `<div class="tree-node">
            <div class="tree-row" style="padding-left:${6 + depth * 8}px">
              <button type="button" class="tree-toggle" data-dir="${node.path}" aria-label="${t('expand')}">${open ? '▾' : '▸'}</button>
              <span class="tree-icon">📁</span>
              <span class="tree-label" data-kind="dir">${node.name}</span>
            </div>
            ${open ? `<div class="tree-children">${renderTreeNodes(node.children || [], depth + 1)}</div>` : ''}
          </div>`
        }
        const active = node.preview && node.stem === name ? ' data-active="true"' : ''
        const preview = node.preview ? ` data-stem="${node.stem}"` : ''
        return `<div class="tree-node">
          <button type="button" class="tree-row" style="padding-left:${24 + depth * 8}px"${active}${preview} data-path="${node.path}">
            <span class="tree-icon">${fileIcon(node)}</span>
            <span class="tree-label" data-kind="file">${node.name}</span>
          </button>
        </div>`
      }).join('')
    }

    function renderFileTree() {
      if (!fileTree.length) {
        fileTreeEl.innerHTML = '<div class="tree-empty">' + t('treeEmpty') + '</div>'
        return
      }
      fileTreeEl.innerHTML = renderTreeNodes(fileTree)
    }

    function syncChrome() {
      crumbName.textContent = name || '—'
      dims.textContent = dimText()
      document.title = 'EasyCAD · ' + (name || '—')
      if (partsSelect && partsSelect.value !== name) partsSelect.value = name
      renderFileTree()
    }

    async function fetchCatalog() {
      const res = await fetch(base + '/parts', { cache: 'no-store' })
      if (!res.ok) return { names: [], parts: [] }
      return normalizeCatalog(await res.json())
    }

    async function fetchTree() {
      const res = await fetch(base + '/tree', { cache: 'no-store' })
      if (!res.ok) return []
      const data = await res.json()
      return Array.isArray(data.tree) ? data.tree : []
    }
    function renderParamList() {
      paramList.innerHTML = PARAM_ORDER.map((key) => {
        const val = allParams[key]
        if (val == null && key === 'hole_d') return ''
        const label = PARAM_LABELS[key] || key
        const feature = key === 'hole_d' ? 'hole' : key
        const active = featureSel === feature ? ' data-active="true"' : ''
        const shown = val != null ? Number(val).toFixed(key === 'hole_d' ? 1 : 2) : '—'
        return `<div class="param-row"${active} data-feature="${feature}"><span class="param-label">${label}</span><span class="param-value">${shown}</span></div>`
      }).join('')
    }

    function renderArtifacts() {

      const row = partsCatalog.find((item) => item.name === name)
      const links = []
      if (row && row.hasStep) links.push(`<a href="${base}/models/${name}.step" download>STEP · models/${name}.step</a>`)
      else if (row && row.hasGlb) links.push(`<a href="${base}/models/${name}.glb" download>GLB · models/${name}.glb</a>`)
      if (runnerState.hasShot) {
        links.push(`<a href="${base}/models/${name}.shot.step" download>SHOT · models/${name}.shot.step</a>`)
      }
      if (runnerState.hasMold) {
        links.push(`<a href="${base}/models/${name}.mold.step" download>MOLD · models/${name}.mold.step</a>`)
      }
      artifactsEl.innerHTML = links.length ? links.join('') : '<div class="info-empty">' + t('noArtifact') + '</div>'
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
    }

    async function fetchJson(url) {
      try { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) return null; return await r.json() } catch { return null }
    }

    async function renderIssues() {
      const box = document.getElementById('issues')
      const badge = document.getElementById('issues-badge')
      if (!box) return
      const qa = await fetchJson(base + '/models/' + name + '.qa.json')
      const items = []
      let issues = 0
      if (qa && Array.isArray(qa.checks)) {
        for (const c of qa.checks) {
          if (!c || c.id === 'single_body' || c.kind === 'single_body') continue
          const ok = c.pass !== false
          if (!ok) issues += 1
          const got = c.got_mm ? (Array.isArray(c.got_mm) ? c.got_mm.join('×') : c.got_mm) : ''
          items.push(`<div class="issue-row" data-kind="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✕'} ${esc(c.id || c.kind || 'check')}${got ? ' · ' + esc(got) : ''}</div>`)
        }
      } else {
        items.push('<div class="info-empty">' + t('noQa') + '</div>')
      }
      // CAD vs reference-image similarity (advisory; never blocks geometry QA).
      const sim = await fetchJson(base + '/models/' + name + '.similarity.json')
      if (sim && sim.present) {
        const simOk = sim.pass !== false
        const frag = String(sim.note || '').indexOf('fragmented') !== -1
        const kind = frag ? 'warn' : (simOk ? 'ok' : 'bad')
        items.push(`<div class="issue-row" data-kind="${kind}">${simOk ? '✓' : '✕'} image_similarity · ${Number(sim.score).toFixed(2)} (${esc(sim.grade)} · ${esc(sim.best_view)} ${t('simView')})${frag ? ' · ' + t('simFragment') : ''}</div>`)
      } else if (sim) {
        items.push('<div class="issue-row" data-kind="muted">— image_similarity · ' + t('simMissing') + '</div>')
      }
      if (faceTopology && Array.isArray(faceTopology.faces) && faceTopology.faces.length) {
        items.push(`<div class="issue-row" data-kind="ok">✓ ${t('topoOk', { n: faceTopology.faces.length })}</div>`)
      } else {
        items.push('<div class="issue-row" data-kind="warn">⚠ ' + t('topoMissing') + '</div>')
      }
      box.innerHTML = items.join('')
      if (badge) {
        if (issues > 0) { badge.textContent = String(issues); badge.dataset.kind = 'warn' }
        else if (qa && qa.pass) { badge.textContent = '✓'; badge.dataset.kind = 'ok' }
        else { badge.textContent = ''; badge.dataset.kind = '' }
      }
    }

    async function renderTree() {
      const box = document.getElementById('tree')
      if (!box) return
      let html = ''
      const faces = (faceTopology && Array.isArray(faceTopology.faces) && faceTopology.faces.length) ? faceTopology.faces : []
      const ir = await fetchJson(base + '/models/' + name + '.ir.json')
      // cad-viewer-style entity tree: part name (root) -> its B-rep faces (#id · type),
      // clicking a face row selects + highlights that face.
      html += `<div class="tree-item tree-root">${esc(name || ir?.name || t('partFallback'))}${faces.length ? ` <span class="tree-count">${t('faceCount', { n: faces.length })}</span>` : ''}</div>`
      if (faces.length) {
        html += faces.map((fc) => {
          const active = selected === fc.id ? ' tree-active' : ''
          return `<div class="tree-item tree-leaf${active}" data-face="${fc.id}">#${fc.id} · ${esc(fc.type)}</div>`
        }).join('')
      } else if (ir && (ir.features || []).length) {
        html += (ir.features || []).map((f) => `<div class="tree-item tree-leaf">${esc(f.text || f.id || 'feature')}</div>`).join('')
      } else {
        html += '<div class="info-empty">' + t('noFaces') + '</div>'
      }
      box.innerHTML = html
    }

    async function renderMetadata() {

      if (!ir) { box.innerHTML = '<div class="info-empty">' + t('noMeta') + '</div>'; return }

        + `<div class="info-row"><span>${t('metaSource')}</span><span class="info-val">${esc(step)}</span></div>`
        + (ir.intent ? `<div class="info-row"><span>${t('metaIntent')}</span><span class="info-val">${esc(ir.intent)}</span></div>` : '')

    async function renderAdvice() {
      const box = document.getElementById('advice')
      if (!box) return
      const advice = await fetchJson(base + '/models/' + name + '.advice.json')
      const items = Array.isArray(advice && advice.items)

      const head = `<div class="issue-row" data-kind="${ok ? 'ok' : 'warn'}">${ok ? '✓' : '⚠'} ${t('adviceMode')} · ${esc(summary)}</div>`
      const rows = items.map((it) => {
        const kind = it.severity === 'error' ? 'bad' : (it.severity === 'ok' ? 'ok' : 'warn')
        return `<div class="advice-row" data-kind="${kind}">`
          + `<div class="advice-copy"><div class="advice-title">${esc(it.title || '')}</div>`
          + `<div class="advice-text">${esc(it.text || '')}</div></div>`
          + `<button type="button" class="advice-run" data-advice-id="${esc(it.id)}" title="${esc(t('runAdviceTitle'))}">${esc(t('runAdvice'))}</button>`

      box.innerHTML = head + rows
